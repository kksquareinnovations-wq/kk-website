name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  EC2_HOST: 18.117.84.247
  EC2_USER: ec2-user
  APP_PATH: /home/ec2-user/extension-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js project
        run: npm run build

      - name: Create SSH key file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create application directory on EC2
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
            "mkdir -p ${{ env.APP_PATH }}"

      - name: Setup Node.js on EC2
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
            # Check if nvm is already installed
            if [ ! -d "$HOME/.nvm" ]; then
              echo "Installing nvm..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
            fi
            
            # Load nvm
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Install Node.js 20 if not already installed
            if ! nvm ls 20 &>/dev/null; then
              echo "Installing Node.js 20..."
              nvm install 20
            fi
            
            # Use Node.js 20
            nvm use 20
            nvm alias default 20
            
            # Install PM2 globally if not already installed
            if ! command -v pm2 &>/dev/null; then
              echo "Installing PM2..."
              npm install -g pm2
            fi
          EOF

      - name: Upload build files to EC2
        run: |
          scp -r .next ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.APP_PATH }}/
          scp -r public ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.APP_PATH }}/
          scp package.json ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.APP_PATH }}/
          scp package-lock.json ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.APP_PATH }}/ 2>/dev/null || true

      - name: Install dependencies on EC2
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ env.APP_PATH }} && npm ci
          EOF

      - name: Grant Port 80 Access to Node
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            sudo setcap 'cap_net_bind_service=+ep' $(readlink -f $(which node))
          EOF

      - name: Restart application
        run: |
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ env.APP_PATH }} && pm2 restart portfolio || pm2 start 'npm start' --name portfolio
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ env.EC2_HOST }} || exit 1

      - name: Deployment successful
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Website: http://${{ env.EC2_HOST }}"
          echo "� Elastic IP: ${{ env.EC2_HOST }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above."
