name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  EC2_HOST: 18.218.150.24
  EC2_USER: ec2-user
  APP_PATH: /home/ec2-user/extension-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js project
        run: npm run build

      - name: Create SSH key file
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      - name: Configure SSH settings
        run: |
          cat >> ~/.ssh/config << EOF
          Host ec2-deploy
            HostName ${{ env.EC2_HOST }}
            User ${{ env.EC2_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 60
            ServerAliveCountMax 3
            ConnectTimeout 10
          EOF

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh ec2-deploy "echo 'SSH connection successful'"

      - name: Upload build files to EC2
        run: |
          scp -r .next ec2-deploy:${{ env.APP_PATH }}/
          scp -r public ec2-deploy:${{ env.APP_PATH }}/
          scp package.json ec2-deploy:${{ env.APP_PATH }}/
          scp package-lock.json ec2-deploy:${{ env.APP_PATH }}/ 2>/dev/null || true

      - name: Install dependencies on EC2
        run: |
          echo "🔧 Installing production dependencies on EC2..."
          ssh ec2-deploy "cd ${{ env.APP_PATH }} && npm ci --omit=dev" || \
          ssh ec2-deploy "cd ${{ env.APP_PATH }} && npm install --production" || \
          ssh ec2-deploy "cd ${{ env.APP_PATH }} && npm install --only=production"
          echo "✅ Dependencies installed successfully"

      - name: Restart application
        run: |
          ssh ec2-deploy "pm2 restart portfolio || pm2 start 'npm start' --name portfolio"

      - name: Verify deployment
        run: |
          sleep 5
          curl -f http://${{ env.EC2_HOST }} || exit 1

      - name: Deployment successful
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Website: http://${{ env.EC2_HOST }}"
          echo "� Elastic IP: ${{ env.EC2_HOST }}"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above."
